name: Counterweight validation
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_fork:
        description: Run the canonical-token mainnet fork proof
        type: boolean
        default: false
      run_graph:
        description: Run the credentialed live Graph and canonical-token F2 proof
        type: boolean
        default: false
      run_privy:
        description: Run the credentialed Privy permission and live Graph settlement proof
        type: boolean
        default: false
      run_mvp:
        description: Run the complete credentialed F4 scenario and restart proof
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Replay audits verify source hashes at the recorded proof revision.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - name: Install locked dependencies and verified Foundry
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          bash scripts/setup/install-foundry.sh
          echo "$PWD/.tools/foundry" >> "$GITHUB_PATH"
      - name: Validate specification and upstream integration provenance
        run: |
          python3 scripts/planning/validate_phase0.py
          python3 scripts/planning/validate_upstream.py
      - name: Run deterministic strategy, settlement, stateful and prototype E2E checks
        run: |
          forge fmt --check
          mkdir -p artifacts/ci
          set -o pipefail
          npm test | tee artifacts/ci/tests.txt
          node --test test/submission/*.test.mjs | tee artifacts/ci/submission-tests.txt
          node scripts/proofs/prototype.mjs --out artifacts/ci/prototype.json > /dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deterministic-evidence
          path: |
            artifacts/ci/
            cache/fuzz/
            cache/invariant/
          if-no-files-found: error
  fork:
    if: github.event_name == 'workflow_dispatch' && inputs.run_fork
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - name: Install locked dependencies and verified Foundry
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          bash scripts/setup/install-foundry.sh
          echo "$PWD/.tools/foundry" >> "$GITHUB_PATH"
      - name: Run fork E2E and retain standalone proof
        env:
          ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
        run: |
          mkdir -p artifacts/ci
          set -o pipefail
          npm run test:fork | tee artifacts/ci/fork-tests.txt
          node scripts/proofs/f1.mjs --out artifacts/ci/f1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fork-settlement-evidence
          path: artifacts/ci/
          if-no-files-found: error

  graph:
    if: github.event_name == 'workflow_dispatch' && inputs.run_graph
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - name: Install locked dependencies and verified Foundry
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          bash scripts/setup/install-foundry.sh
          echo "$PWD/.tools/foundry" >> "$GITHUB_PATH"
      - name: Run live Graph preflight and settlement E2E
        env:
          GRAPH_API_KEY: ${{ secrets.GRAPH_API_KEY }}
          ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
        run: |
          mkdir -p artifacts/ci
          set -o pipefail
          node scripts/proofs/graph-preflight.mjs --out artifacts/ci/graph-preflight
          npm run test:live | tee artifacts/ci/live-tests.txt
          node scripts/proofs/f2.mjs --out artifacts/ci/f2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graph-settlement-evidence
          path: artifacts/ci/
          if-no-files-found: error

  privy:
    if: github.event_name == 'workflow_dispatch' && (inputs.run_privy || inputs.run_mvp)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: counterweight-privy-development-wallet
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - name: Install locked dependencies and verified Foundry
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          bash scripts/setup/install-foundry.sh
          echo "$PWD/.tools/foundry" >> "$GITHUB_PATH"
      - name: Materialize approved development key and resource bundles
        env:
          PRIVY_KEYS_JSON: ${{ secrets.PRIVY_KEYS_JSON }}
          PRIVY_RESOURCES_JSON: ${{ secrets.PRIVY_RESOURCES_JSON }}
        run: |
          node --input-type=module <<'JS'
          import {mkdir,writeFile} from 'node:fs/promises';
          if(!process.env.PRIVY_KEYS_JSON||!process.env.PRIVY_RESOURCES_JSON)throw Error('Approved Privy bundles required');
          await mkdir('.secrets',{mode:0o700});
          await writeFile('.secrets/privy-development.json',process.env.PRIVY_KEYS_JSON,{mode:0o600});
          await writeFile('.secrets/privy-resources.json',process.env.PRIVY_RESOURCES_JSON,{mode:0o600});
          JS
      - name: Run credentialed Privy preflight, CLI E2E and retained proof
        if: inputs.run_privy
        env:
          GRAPH_API_KEY: ${{ secrets.GRAPH_API_KEY }}
          PRIVY_APP_ID: ${{ secrets.PRIVY_APP_ID }}
          PRIVY_APP_SECRET: ${{ secrets.PRIVY_APP_SECRET }}
          ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
        run: |
          mkdir -p artifacts/ci
          set -o pipefail
          node scripts/proofs/privy-preflight.mjs --out artifacts/ci/privy-preflight
          npm run test:privy | tee artifacts/ci/privy-tests.txt
          node scripts/proofs/f3.mjs --out artifacts/ci/f3
      - name: Run integrated MVP CLI E2E and retained proof
        if: inputs.run_mvp
        env:
          GRAPH_API_KEY: ${{ secrets.GRAPH_API_KEY }}
          PRIVY_APP_ID: ${{ secrets.PRIVY_APP_ID }}
          PRIVY_APP_SECRET: ${{ secrets.PRIVY_APP_SECRET }}
          ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
        run: |
          mkdir -p artifacts/ci
          set -o pipefail
          npm run test:mvp | tee artifacts/ci/mvp-tests.txt
          node scripts/proofs/mvp.mjs --out artifacts/ci/f4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: privy-permission-evidence
          path: artifacts/ci/
          if-no-files-found: error
