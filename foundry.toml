[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 700
via_ir = true
remappings = ["forge-std/=node_modules/forge-std/src/"]
fs_permissions = [{ access = "read", path = "./planning/phase0/fixtures" }]

[profile.default.fuzz]
runs = 1000
seed = "0xc0ffee"

[profile.default.invariant]
runs = 128
depth = 32
fail_on_revert = true
